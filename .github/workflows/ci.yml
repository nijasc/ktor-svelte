name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.areas.outputs.code }}
      examples: ${{ steps.areas.outputs.examples }}
      setup: ${{ steps.areas.outputs.setup }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed-areas.sh "$EVENT" "$BASE" "$HEAD"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: ./gradlew check apiCheck
        shell: bash

  gradle-8:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: ./gradlew :ktor-svelte-gradle-plugin:functionalTest -PtestGradleVersion=8.14.6 -PtestShadowVersion=9.2.2

  example-bun:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: ./gradlew -p examples/basic e2eTest svelteCheck
        shell: bash
      - run: ./gradlew -p examples/notes e2eTest svelteCheck
        shell: bash

  setup:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.setup == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Create a project with the default options and build it
        shell: bash
        run: |
          repository="$PWD"
          cd "$RUNNER_TEMP"
          java "$repository/scripts/Setup.java" "--local-build=$repository" --yes --name=demo --i18n --locales=en,de --no-git
          cd demo
          ./gradlew check buildFatJar svelteCheck
          ./gradlew svelteRun --script=lint
      - name: Create a project with every option and build it
        shell: bash
        run: |
          repository="$PWD"
          cd "$RUNNER_TEMP"
          java "$repository/scripts/Setup.java" "--local-build=$repository" --yes --name=full --i18n --locales=en,de --locale-strategy=UrlPrefix --auth --database --conventions --no-git
          cd full
          ./gradlew check buildFatJar svelteCheck
          ./gradlew svelteRun --script=lint
      - name: Create a project with no options and build it
        shell: bash
        run: |
          repository="$PWD"
          cd "$RUNNER_TEMP"
          java "$repository/scripts/Setup.java" "--local-build=$repository" --yes --name=small --no-generate-ts --no-daisy --no-tailwind --no-lucide --no-idea-ext --no-docker --no-github-actions --no-git
          cd small
          ./gradlew check buildFatJar svelteCheck
          ./gradlew svelteRun --script=lint

  generated-client:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: ./gradlew -p examples/notes svelteGenerateTs
      - run: git diff --exit-code examples/notes/frontend/src/lib/api

  example-npm:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.examples == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Switch the example to npm
        working-directory: examples/basic/frontend
        run: |
          rm bun.lock
          npm install --package-lock-only
      - run: ./gradlew -p examples/basic e2eTest

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - if: ${{ needs.changes.outputs.code == 'true' }}
        run: ./gradlew dokkaGenerate
      - name: Build the generator playground
        run: ./gradlew -p docs/playground compileProductionLibraryKotlinJs
      - name: Build the docs site
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun install --frozen-lockfile
          bun run build
