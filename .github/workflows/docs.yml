name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - ktor-svelte-server/src/main/**
      - ktor-svelte-gradle-plugin/src/main/**
      - .github/workflows/docs.yml
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish, such as 0.9.0, or main
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || 'main' }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (inputs.version && inputs.version != 'main') && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Build the API reference
        run: |
          if [ "$VERSION" = main ]; then
            ./gradlew dokkaGenerate
          else
            ./gradlew dokkaGenerate -PreleaseVersion="$VERSION"
          fi
      - name: Build the generator playground
        run: ./gradlew -p docs/playground compileProductionLibraryKotlinJs
      - name: Build the docs
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_VERSION: ${{ inputs.version || 'main' }}
        run: |
          bun install --frozen-lockfile
          if [ "$VERSION" = main ]; then
            DOCS_BASE="/ktor-svelte/main/" bun run build
          else
            DOCS_BASE="/ktor-svelte/v$VERSION/" bun run build
          fi
          mv .vitepress/dist "$RUNNER_TEMP/versioned"
          cp -r ../build/dokka/html "$RUNNER_TEMP/versioned/api"
          if [ "$VERSION" = main ]; then
            cp -r "$RUNNER_TEMP/versioned" "$RUNNER_TEMP/latest"
          else
            DOCS_BASE="/ktor-svelte/" bun run build
            mv .vitepress/dist "$RUNNER_TEMP/latest"
            cp -r ../build/dokka/html "$RUNNER_TEMP/latest/api"
          fi
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:$TOKEN@github.com/$REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            site="$RUNNER_TEMP/site-$attempt"
            if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
              git clone --quiet --depth 1 --branch gh-pages "$remote" "$site"
            else
              git init --quiet --initial-branch gh-pages "$site"
              git -C "$site" remote add origin "$remote"
            fi
            bun docs/scripts/publish.mjs "$VERSION" "$RUNNER_TEMP/latest" "$RUNNER_TEMP/versioned" "$site"
            git -C "$site" config user.name "github-actions[bot]"
            git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$site" add --all
            if git -C "$site" diff --cached --quiet; then
              exit 0
            fi
            git -C "$site" commit --quiet -m "docs: publish $VERSION"
            if git -C "$site" push --quiet origin gh-pages; then
              exit 0
            fi
            echo "gh-pages moved while publishing, trying again."
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
